# AgricultureID is no longer hosted on Netlify.
#
# Since 2026-11 agricultureid.com is served by Cloudflare Workers from a static
# export (wrangler.jsonc, docs/cloudflare-deployment.md). The Netlify project
# `agrigultureid` is kept only until the owner deletes it; it receives no
# traffic, because the domain's DNS now points at Cloudflare.
#
# `ignore` exiting 0 tells Netlify to skip every build, so a push to `main` or a
# pull request no longer builds or publishes anything there. Without it Netlify
# would keep building this repository on every push — now as a static export
# its Next.js adapter was not configured for — for a host nobody visits.
#
# The Netlify-era configuration (Next.js adapter, the /journal proxy rules and
# the preview X-Robots-Tag headers) is in git history: see docs/netlify-
# deployment.md and docs/journal-routing-architecture.md.

[build]
  ignore = "exit 0"
