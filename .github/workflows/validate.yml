name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, types, lint, content, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Content validation
        run: npm run content:validate

      - name: Ecosystem registry validation
        run: npm run ecosystem:validate

      - name: Canonical jurisdiction validation
        run: npm run jurisdictions:validate

      - name: Agricultural authorities validation
        run: npm run authorities:validate

      - name: Agricultural registries validation
        run: npm run registries:validate

      - name: Agricultural compliance validation
        run: npm run regulations:validate

      - name: Agricultural support validation
        run: npm run support:validate

      - name: Crop calendar validation
        run: npm run calendars:validate

      - name: Biosecurity status validation
        run: npm run biosecurity:validate

      - name: Variety registration validation
        run: npm run varieties:validate

      - name: Market data validation
        run: npm run markets:validate

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Rendered-link audit (real HTML crawl — needs the build output)
        run: npm run seo:rendered

      - name: Consent audit (no pre-consent tracker in built HTML)
        run: npm run consent:audit

      - name: Ecosystem audit (real rendered HTML — one nav + all anchors per page)
        run: npm run ecosystem:audit
